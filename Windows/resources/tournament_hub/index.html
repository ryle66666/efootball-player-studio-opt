<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>锦标赛中心</title><style>/*HUB_CSS*/</style></head>
<body><div class="floodlights" aria-hidden="true"></div><div class="pitch" aria-hidden="true"></div>
<div class="shell">
  <nav class="rail" aria-label="锦标赛中心">
    <div class="rail-mark" id="mark" aria-hidden="true"></div>
    <span class="key key-sm rail-key" aria-hidden="true">LB</span>
    <div class="rail-tabs" role="tablist">
      <button role="tab" data-view="summary" id="tab-summary"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4ZM12 14v4M8 20h8"/></svg><span>总结</span></button>
      <button role="tab" data-view="team" id="tab-team"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/></svg><span>选队</span></button>
      <button role="tab" data-view="fixtures" id="tab-fixtures"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>赛程</span></button>
      <button role="tab" data-view="tables" id="tab-tables"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path class="dot" d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>积分榜</span></button>
      <button role="tab" data-view="bracket" id="tab-bracket"><svg viewBox="0 0 24 24"><path d="M3 4.5h6v5H3M3 14.5h6v5H3M9 7h3v10H9M12 12h9"/></svg><span>对阵图</span></button>
      <button role="tab" data-view="leaders" id="tab-leaders"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg><span>数据</span></button>
    </div>
    <span class="key key-sm rail-key" aria-hidden="true">RB</span>
    <span class="rail-fill"></span>
    <button id="refresh" class="rail-btn" type="button" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span>刷新</span></button>
    <button id="back" class="rail-btn" type="button" aria-label="返回游戏"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>返回</span></button>
  </nav>
  <div class="stage">
    <header class="mast">
      <div class="watermark" id="watermark" aria-hidden="true"></div>
      <div class="mast-l"><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="stg-row" id="stages"></div></div>
      <div class="mast-r" id="club"></div>
    </header>
    <div class="toolbar" id="toolbar"></div>
    <main class="view" id="view" aria-live="polite"></main>
    <div class="pager" id="pager"></div>
  </div>
</div>
<footer class="hints"><span><b class="key">A</b>确认</span><span><b class="key">B</b>返回</span><span><b class="key">LB</b><b class="key">RB</b>切换页面</span><span><b class="key">LT</b><b class="key">RT</b>轮次 / 翻页</span><span><b class="key">X</b>我的球队</span><span><b class="key">Y</b>刷新</span><span class="save" id="save-note">阵容、比赛计划与进入比赛在游戏的赛事菜单中</span></footer>
<dialog id="detail"><div class="dlg-head"><span id="detail-kicker">MATCH</span><button id="detail-close" type="button" aria-label="关闭"><span class="key key-sm">B</span>关闭</button></div><div id="detail-body"></div></dialog>
<div id="busy" class="busy" hidden><div><i></i><span id="busy-text">处理中…</span></div></div>
<div id="toast" role="status" hidden></div>
<script id="schedule-data" type="application/json">HUB_DATA</script><script>/*HUB_JS*/</script></body></html>
